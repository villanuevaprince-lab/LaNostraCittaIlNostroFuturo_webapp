{% extends "base.html" %}
{% block title %}Dettaglio segnalazione — La Nostra Città{% endblock %}
{% block scripts %}
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js" defer></script>
  <script src="{{ url_for('static', filename='js/location.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/detail.js') }}" defer></script>
{% endblock %}
{% block content %}
  <a class="back-link" href="/">← Torna alla bacheca</a>
  <article class="panel detail" data-report-id="{{ report_id }}" data-moderator="{{ 'true' if g.user and g.user.is_moderator else 'false' }}">
    <p class="eyebrow">Scheda civica</p>
    <p id="detail-status" class="status" role="status">Caricamento…</p>
    <span id="detail-badge" class="badge" hidden></span>
    <h1 id="detail-title" class="page-title"></h1>
    <p id="detail-meta" class="report-meta"></p>
    <div id="detail-categories" class="tag-list" aria-label="Categorie"></div>
    <div class="detail-layout">
      <div>
        <h2>Descrizione</h2><p id="detail-description" class="pre-wrap"></p>
        <div id="detail-media"></div>
        <h2>Discussione</h2><ul id="detail-comments" class="comment-list"></ul>
      </div>
      <aside>
        <h2>Luogo</h2><p id="detail-address"></p>
        <div id="detail-map" class="map" role="region" aria-label="Posizione della segnalazione sulla mappa"></div>
        <p id="detail-coordinates" class="hint"></p>
      </aside>
    </div>
  </article>
{% endblock %}
